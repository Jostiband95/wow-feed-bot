name: WoW Feed Bot

on:
  schedule:
    - cron: "*/10 * * * *"   # elke 10 minuten (GitHub kan wat later starten)
  workflow_dispatch:          # handmatig starten via de knop "Run workflow"
  push:                       # ook meteen draaien als de instellingen of code veranderen
    branches: [main]
    paths:
      - config.json
      - wow_feed_bot.py
      - .github/workflows/bot.yml

permissions:
  contents: write

concurrency:
  group: wow-feed-bot
  cancel-in-progress: false

jobs:
  controleren:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakketten installeren
        run: pip install -r requirements.txt

      - name: Feeds controleren en nieuwe berichten posten
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python wow_feed_bot.py --eenmalig

      - name: Onthouden wat al gepost is
        run: |
          git config user.name "wow-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gezien.json
          git diff --cached --quiet || (git commit -m "Nieuwe berichten gepost" && git push)
